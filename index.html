<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030713" />
    <title>WebPocket · CV Start</title>
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #f8fafc;
        background: #030611;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: radial-gradient(
          circle at 50% 0,
          #17396a 0,
          #061124 33%,
          #02040b 85%
        );
      }
      button,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 18px;
      }
      .pocket {
        --main: #38bdf8;
        --second: #a78bfa;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        width: min(100%, 430px);
        height: min(92vh, 840px);
        height: min(92dvh, 840px);
        min-height: 650px;
        border: 1px solid color-mix(in srgb, var(--main) 60%, #e2e8f0);
        border-radius: 31px;
        background: #030713;
        box-shadow:
          0 24px 90px color-mix(in srgb, var(--main) 26%, transparent),
          inset 0 0 0 1px #ffffff18;
      }
      @media (max-width: 520px) {
        .stage {
          padding: 0;
          place-items: stretch;
          min-height: 100vh;
          min-height: 100dvh;
        }
        .pocket {
          width: 100%;
          max-width: none;
          height: 100vh;
          height: 100dvh;
          min-height: 100vh;
          min-height: 100dvh;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          box-shadow: none;
        }
        .loader-overlay {
          border-radius: 0;
        }
        .app {
          padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px));
        }
      }
      .background {
        position: absolute;
        inset: 0;
        z-index: -3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(1.05) saturate(1.15) contrast(1.05);
        background: #050914;
      }
      .shade {
        position: absolute;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          #03071188 0%,
          #07101e18 22%,
          #06102410 48%,
          #02030bcc 100%
        );
      }
      .app {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 17px 14px 15px;
        gap: 12px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      
      .overlay.open { z-index: 50; }
      .social-float {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 35;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .social-float a {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220cc;
        border: 1px solid #ffffff44;
        box-shadow: 0 6px 16px #0008;
        backdrop-filter: blur(6px);
      }
      .social-float a img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .sound-fab {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 40;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid #ffffff55;
        background: #0b1220cc;
        color: #fff;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px #0008;
      }
      .head.compact {
        min-height: 0;
        margin-bottom: 0;
      }
      .head.compact .brand { display: none; }
      .brand h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.7px;
      }
      .brand small,
      .eyebrow {
        display: block;
        margin-top: 4px;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1.2px;
        color: #dbeafe;
      }
      .status {
        display: inline-block;
        margin-top: 9px;
        border: 1px solid #4ade8080;
        border-radius: 999px;
        padding: 4px 7px;
        background: #052e16a8;
        color: #bbf7d0;
        font-size: 8px;
        font-weight: 900;
      }
      .status.warn {
        border-color: #fde0477d;
        background: #3f2c0399;
        color: #fef08a;
      }
      .counter {
        border: 1px solid #fff4;
        border-radius: 999px;
        padding: 8px 10px;
        background: #06111eb8;
        font-size: 10px;
        font-weight: 900;
      }
      .menu {
        display: flex;
        gap: 6px;
        padding: 8px;
        max-width: 100%;
        overflow: auto;
        border: 1px solid #fff3;
        border-radius: 16px;
        background: #06101bd9;
        backdrop-filter: blur(16px);
        scrollbar-width: none;
      }
      .menu::-webkit-scrollbar {
        display: none;
      }
      .menu.side {
        position: absolute;
        left: 14px;
        top: 132px;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.side-right {
        position: absolute;
        right: 14px;
        top: 132px;
        left: auto;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.floating-right {
        position: absolute;
        right: 14px;
        top: 142px;
        left: auto;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.floating-left {
        position: absolute;
        left: 14px;
        top: 142px;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.bottom {
        order: 0;
        margin-top: 0;
        align-self: stretch;
      }
      .menu button {
        font-size: var(--menu-size, 12px);
        border: 0;
        border-radius: 9px;
        padding: 8px 9px;
        background: transparent;
        color: #f8fafc;
        font-size: 9px;
        font-weight: 900;
        white-space: nowrap;
      }
      .menu button:hover,
      .menu button.active {
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second));
        color: var(--menu-sel, #ffffff) !important;
      }
      .content {
        margin-top: auto;
        padding: 8px 2px;
        color: #f8fafc;
        text-shadow: 0 2px 15px #020617;
      }
      .content.shifted {
        margin-left: 111px;
      }
      .content.shifted-right {
        margin-right: 111px;
      }

      .content h2 { color: var(--text, #f8fafc); }
      .role { color: var(--text2, var(--second, #e2e8f0)); }
      .desc { color: var(--text, #f8fafc); }
      .menu { background: var(--menu-bg, #06101bd9); }
      .menu button { color: var(--menu-no, #f8fafc); }
      .menu button.active, .menu button:hover {
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second));
        color: var(--menu-sel, #ffffff) !important;
      }
      
      .overlay.chat-overlay {
        align-items: center !important;
        justify-content: center;
        padding: 10% 12px 12px !important;
        background: transparent !important;
        backdrop-filter: none !important;
      }
      .overlay.chat-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #02061755;
        backdrop-filter: blur(2.5px);
        pointer-events: none;
        border-radius: 31px;
      }
      .sheet-chat {
        display: flex;
        flex-direction: column;
        max-height: 62%;
        width: 100%;
        margin: auto;
        position: relative;
        z-index: 2;
        background: #0a122066 !important;
        border: 1px solid #ffffff33 !important;
        backdrop-filter: blur(6px);
        box-shadow: 0 16px 40px #0008;
      }
      .sheet-chat.transparent {
        background: #0a122040 !important;
        backdrop-filter: blur(5px);
      }
      .sheet-chat .sheet-head {
        background: transparent;
      }
      .chat-box {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 6px 2px 10px;
        min-height: 160px;
        max-height: 42vh;
      }
      .bubble {
        max-width: 90%;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.45;
        font-weight: 650;
        text-shadow: 0 1px 3px #000a;
      }
      .bubble.bot {
        align-self: flex-start;
        background: transparent;
        border: 0;
        color: #f8fafc;
        border-bottom-left-radius: 4px;
      }
      .bubble.user {
        align-self: flex-end;
        background: transparent;
        border: 0;
        color: #fff;
        border-bottom-right-radius: 4px;
        text-align: right;
      }
      .bubble.typing { opacity: 0.75; font-style: italic; }
      .chat-form {
        display: flex;
        gap: 8px;
        align-items: center;
        border-top: 1px solid #ffffff22;
        padding-top: 10px;
        background: transparent;
      }
      .chat-form input {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid #ffffff44;
        background: #0b1220aa;
        color: #fff;
        padding: 0 12px;
        font-size: 14px;
      }
      .chat-send {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second));
        color: var(--menu-sel, #fff);
      }

      .action {
        color: var(--btn-letra, #ffffff) !important;
      }
      .action.primary {
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second)) !important;
        color: var(--btn-letra, #ffffff) !important;
      }
      .action:not(.primary) {
        color: var(--btn-letra2, var(--btn-letra, #e2e8f0)) !important;
      }
      .action.primary * { color: inherit !important; }
      /* menú: solo aquí se usan --menu-sel / --menu-no */
      .menu button {
        color: var(--menu-no, #e2e8f0) !important;
      }
      .menu button.active {
        color: var(--menu-sel, #ffffff) !important;
      }

      .content h2 {
        margin: 7px 0;
        font-size: clamp(37px, 10vw, 56px);
        line-height: 0.88;
        letter-spacing: -2.8px;
        max-width: 9ch;
      }
      .role {
        margin: 0 0 11px;
        font-size: 13px;
        font-weight: 800;
      }
      .desc {
        max-width: 32ch;
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        font-weight: 600;
      }
      .location {
        margin: 11px 0 0;
        font-size: 11px;
        font-weight: 750;
      }
      
      .format-caption {
        margin: 12px 0 0;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1px;
        opacity: 0.82;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .actions.single {
        grid-template-columns: 1fr;
      }
      .action {
        min-height: 47px;
        border: 1px solid #fff4;
        border-radius: 15px;
        background: #06111eb8;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        text-decoration: none;
        display: grid;
        place-items: center;
      }
      .action.primary {
        border-color: transparent;
        color: #06111c;
        background: linear-gradient(135deg, var(--main), var(--second));
        box-shadow: 0 10px 26px color-mix(in srgb, var(--main) 40%, transparent);
      }
      .profile-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .profile-tools button {
        min-height: 42px;
        border: 1px solid #fff4;
        border-radius: 12px;
        background: #06111eb8;
        color: #fff;
        font-size: 11px;
        font-weight: 850;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .dots {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .dot {
        border: 0;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ffffff66;
        padding: 0;
      }
      .dot.active {
        width: 20px;
        background: var(--main);
      }
      .foot-note {
        font-size: 8px;
        letter-spacing: 0.8px;
        font-weight: 850;
        opacity: 0.72;
      }
      .join {
        display: flex;
        justify-content: center;
        margin-top: 2px;
      }
      .join a {
        min-height: 48px;
        padding: 12px 28px;
        border-radius: 999px;
        text-decoration: none;
        background: linear-gradient(135deg, #fff45a, #facc15);
        color: #16130a;
        font-size: 13px;
        font-weight: 950;
        box-shadow:
          0 0 0 1px #fff8,
          inset 0 1px #fff9,
          0 0 26px #facc1580;
      }
      .overlay {
        display: none;
        position: absolute;
        z-index: 10;
        inset: 0;
        padding: 12px;
        background: linear-gradient(180deg, #01030af0, #02030df4);
        backdrop-filter: blur(11px);
      }
      .overlay.open {
        display: flex;
        align-items: flex-start;
        padding-top: 8px;
        overflow-y: auto;
      }
      .sheet {
        max-height: 92%;
        width: 100%;
        overflow: auto;
        margin-top: 0;
        align-self: flex-start;
        border: 1px solid color-mix(in srgb, var(--main) 75%, #d9f99d);
        border-radius: 23px;
        padding: 18px;
        background: linear-gradient(
          155deg,
          #060a15fa 0%,
          #040812fc 58%,
          #02040bf9 100%
        );
        color: #f8fafc;
        box-shadow: 0 24px 70px #000d;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 14px;
      }
      .sheet h3 {
        margin: 0;
        font-size: 21px;
      }
      .sheet p {
        font-size: 12px;
        line-height: 1.45;
        color: #dbeafe;
      }
      .close {
        width: 34px;
        height: 34px;
        border: 1px solid #fff4;
        border-radius: 50%;
        background: #0a1222;
        color: #fff;
        font-size: 19px;
      }
      .card-list,
      .gallery {
        display: grid;
        gap: 10px;
      }
      .card {
        padding: 12px;
        border: 1px solid #ffffff24;
        border-radius: 14px;
        background: #0a1020e8;
      }
      .card b {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }
      .card p {
        margin: 0;
      }
      .product {
        gap: 9px;
        align-items: center;
      }
      .product img {
        object-fit: cover;
        border-radius: 12px;
        background: #0f172a;
      }
      .card-list .card.product {
        display: grid;
        grid-template-columns: 62px 1fr;
      }
      .card-list .card.product img {
        width: 62px;
        height: 62px;
      }
      .cart-carrusel {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 4px 2px 12px;
        -webkit-overflow-scrolling: touch;
      }
      .cart-carrusel .card.product {
        min-width: 82%;
        scroll-snap-align: center;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0;
        overflow: hidden;
      }
      .cart-carrusel .card.product img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 14px 14px 0 0;
      }
      .cart-carrusel .card.product > div {
        padding: 0 12px 12px;
      }
      .cart-grilla {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .cart-grilla .card.product {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        text-align: center;
      }
      .cart-grilla .card.product img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 12px;
      }
      .cart-lista {
        display: grid;
        gap: 8px;
      }
      .cart-lista .card.product {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        align-items: center;
        padding: 10px;
      }
      .cart-lista .card.product img {
        width: 56px;
        height: 56px;
        border-radius: 10px;
      }
      .cart-vitrina .card.product {
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--main) 55%, #fff3);
      }
      .cart-vitrina .card.product img {
        width: 100%;
        height: 190px;
      }
      .cart-vitrina .card.product > div {
        padding: 0 14px 14px;
        text-align: center;
      }
      .cart-market {
        display: grid;
        gap: 10px;
      }
      .cart-market .card.product {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 10px;
        border: 1px solid color-mix(in srgb, var(--main) 45%, #fff2);
        background: linear-gradient(
          135deg,
          #0a1020ee,
          color-mix(in srgb, var(--main) 12%, #0a1020)
        );
      }
      .cart-market .card.product img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .qty button {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid #ffffff33;
        background: linear-gradient(180deg, #1e293bcc, #0f172acc);
        color: #fff;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
      }
      .qty span {
        min-width: 24px;
        text-align: center;
        font-weight: 800;
      }
      .carta-sheet {
        min-height: 100%;
        height: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .carta-sheet.full {
        position: absolute;
        inset: 0;
        border-radius: 0;
        max-width: 100%;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .carta-sheet .carta-inner {
        flex: 1;
        overflow-y: auto;
        padding: 14px 14px 100px;
        -webkit-overflow-scrolling: touch;
      }
      .carta-sheet .carta-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        z-index: 0;
      }
      .carta-sheet .carta-bg::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0008, #000c);
      }
      .carta-sheet .sheet-head,
      .carta-sheet .carta-inner,
      .carta-sheet .order-box {
        position: relative;
        z-index: 1;
      }
      .carta-sheet .order-box {
        position: sticky;
        bottom: 0;
        padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, #0b1220ee 30%);
      }
      
        position: relative;
        overflow: hidden;
        min-height: min(92dvh, 720px) !important;
        max-height: none !important;
      }
      .overlay.open:has(.carta-sheet) {
        align-items: stretch;
      }
      .carta-sheet .carta-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
        filter: brightness(0.5);
      }
      .carta-sheet .carta-inner {
        position: relative;
        z-index: 1;
      }
      .carta-menu {
        white-space: pre-wrap;
        font-size: 17px;
        line-height: 1.55;
        font-weight: 700;
        color: #f8fafc;
        text-shadow: 0 2px 8px #000a;
        padding: 14px;
        border-radius: 14px;
        background: #00000066;
        border: 1px solid #ffffff22;
        margin-bottom: 12px;
      }
      .carta-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 14px;
        margin-bottom: 8px;
        border-radius: 14px;
        background: #0b1220e6;
        border: 1px solid #ffffff22;
      }
      .carta-item b {
        font-size: 15px;
        font-weight: 800;
        flex: 1;
      }
      .order-box {
        margin-top: 14px;
        padding: 14px;
        border-radius: 16px;
        border: 1px solid #25d36655;
        background: linear-gradient(160deg, #0d2818ee, #0a1f14f0);
        box-shadow: 0 8px 28px #0008;
      }
      .order-box strong {
        display: block;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .btn-wa {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 52px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(180deg, #25d366, #1ebe57);
        color: #04150a !important;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.2px;
        box-shadow: 0 10px 24px #25d36644;

      const parseMapCoords = (mapsUrl, lat, lng) => {
        let la = lat != null && String(lat).trim() !== "" ? Number(lat) : null;

        if (la != null && ln != null && !Number.isNaN(la) && !Number.isNaN(ln)) {

        let m = s.match(/@(-?\d+\.?\d*),\s*(-?\d+\.?\d*)/);
        if (m) return { lat: Number(m[1]), lng: Number(m[2]) };
        // q=-12.046,-77.042 or q=-12.046%2C-77.042
        m = s.match(/[?&]q=(-?\d+\.?\d*)[,+%20]+(-?\d+\.?\d*)/i);
        if (m) return { lat: Number(m[1]), lng: Number(m[2]) };

      const videoEmbedHtml = (url) => {

          const u = new URL(raw.startsWith("http") ? raw : "https://" + raw);
          const host = u.hostname.replace(/^www\./, "").toLowerCase();
          if (host.includes("youtube.com") || host === "youtu.be") {
            const id =
              u.searchParams.get("v") ||
              u.pathname.split("/").filter(Boolean).pop();
            if (!id)
              return `<p class="message">Esta página no se puede acceder al video.</p>`;
            return `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}" allowfullscreen loading="lazy" title="Video"></iframe>`;
          }
          if (host.includes("vimeo.com")) {
            const id = u.pathname.split("/").filter(Boolean).pop();
            if (!id)
              return `<p class="message">Esta página no se puede acceder al video.</p>`;
            return `<iframe src="https://player.vimeo.com/video/${encodeURIComponent(id)}" allowfullscreen loading="lazy" title="Video"></iframe>`;
          }
          if (/\.(mp4|webm|ogg)(\?|$)/i.test(u.pathname)) {
            return `<video controls playsinline src="${esc(raw)}" style="width:100%;border-radius:13px;background:#000"></video>`;
          }
          return `<iframe src="${esc(raw)}" loading="lazy" title="Video"></iframe><p class="message">Si no se ve el video, esta página no permite incrustarlo o el formato no es compatible.</p>`;
        } catch {

      const parseProductMeta = (raw) => {
        const obj = typeof raw === "string" ? { descripcion: raw } : raw || {};
        let d = String(obj.descripcion || obj.nombre || "");
        // soporta salto de línea o espacio antes de @@MOCKUP@@
        const marker = "@@MOCKUP@@";
        const ix = d.indexOf(marker);
        let mockup = null;
        let name = d.trim();
        if (ix >= 0) {
          name = d.slice(0, ix).replace(/\s+$/g, "").trim() || "Producto";
          try {
            mockup = JSON.parse(d.slice(ix + marker.length).trim());
          } catch (_) {
            try {
              // a veces el JSON viene con entidades o recortes
              const j = d.slice(ix + marker.length).trim();
              mockup = JSON.parse(j.replace(/&quot;/g, '"'));
            } catch {
              mockup = null;
            }
          }
        }
        return {
          name,
          mockup,
          foto: obj.foto || obj.url_foto || "",
          precio: Number(obj.precio || 0),
          moneda: obj.moneda || "PEN",
          stock: obj.stock,

      const loadImg = (src) =>
        new Promise((resolve, reject) => {
          const im = new Image();

          im.onload = () => resolve(im);
          im.onerror = () => reject(new Error("No se pudo cargar imagen"));
          im.src = src;

      const renderMockupCanvas = async () => {
        const m = state.mockup;
        if (!m) return;
        const canvas = document.getElementById("mockup-canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const base = m.bases[m.baseIndex] || m.bases[0];
        try {
          const shirt = await loadImg(base.foto);
          canvas.width = 600;
          canvas.height = 600;
          ctx.fillStyle = "#111";
          ctx.fillRect(0, 0, 600, 600);
          const scale = Math.max(600 / shirt.width, 600 / shirt.height);
          const sw = shirt.width * scale;
          const sh = shirt.height * scale;
          ctx.drawImage(shirt, (600 - sw) / 2, (600 - sh) / 2, sw, sh);
          if (m.designUrl) {
            const design = await loadImg(m.designUrl);
            const dw = 180 * (m.scale || 1);
            const dh = (design.height / design.width) * dw;
            ctx.globalAlpha = 0.95;
            ctx.drawImage(design, (600 - dw) / 2, 200 * (m.offsetY || 1), dw, dh);
            ctx.globalAlpha = 1;
          }
        } catch (e) {
          ctx.fillStyle = "#fff";
          ctx.font = "16px sans-serif";
          ctx.fillText("No se pudo cargar la plantilla", 20, 40);
        }

        }
        if (state.panel === "maps") {

        if (state.panel === "info") {

          const iSz = _si.secSize || 20;

          return `<aside class="overlay open"><section class="sheet" style="font-family:${_si.secFont || "inherit"}"><div class="sheet-head"><div><span class="eyebrow">CONTACTO</span><h3>Información</h3></div>${close}</div>

            const lower = t.toLowerCase();
            const hasE = /entrada/.test(lower);
            const hasS = /segundo|fondo[s]?/.test(lower);
            if (hasE || hasS) {
              const parts = t.split(/\n(?=\s*(entradas?|segundos?|fondos?)\s*:?\s*$)/im);
              let entradas = [], segundos = [], otros = [];
              let cur = "otros";
              for (const part of parts) {
                const lines = part.split("\n").map((l) => l.trim()).filter(Boolean);
                if (!lines.length) continue;
                const head = lines[0].toLowerCase().replace(/:$/, "").trim();
                if (/^entradas?$/.test(head)) cur = "entradas";
                else if (/^(segundos?|fondos?)$/.test(head)) cur = "segundos";
                const items = lines
                  .slice(/^entradas?$|^(segundos?|fondos?)$/.test(head) ? 1 : 0)
                  .map((l) => l.replace(/^[-•*\d.)\s]+/, "").trim())
                  .filter((l) => l && !/^(entradas?|segundos?|fondos?|menu):?$/i.test(l));
                if (cur === "entradas") entradas = entradas.concat(items);
                else if (cur === "segundos") segundos = segundos.concat(items);
                else otros = otros.concat(items);
              }
              return { entradas, segundos, otros };

            // sin encabezados: primera mitad entradas, resto segundos si hay muchas líneas
            const all = t
              .split("\n")
              .map((l) => l.replace(/^[-•*\d.)\s]+/, "").trim())
              .filter((l) => l);
            if (all.length <= 2) return { entradas: all, segundos: [], otros: [] };
            const mid = Math.ceil(all.length / 2);
            return { entradas: all.slice(0, mid), segundos: all.slice(mid), otros: [] };

        app.querySelectorAll("[data-carta-qty]").forEach((btn) => {
          btn.onclick = () => {
            const id = btn.getAttribute("data-id");
            const dir = btn.getAttribute("data-carta-qty");
            if (!id) return;
            state.cartaCart = state.cartaCart || {};
            const cur = state.cartaCart[id] || 0;
            state.cartaCart[id] = Math.max(0, cur + (dir === "+" ? 1 : -1));
            if (state.cartaCart[id] === 0) delete state.cartaCart[id];
            render();
          };
        });
        app.querySelector("[data-wa-carta]")?.addEventListener("click", () => {
          const p = state.profiles[state.index];
          const tel = phoneOf(p);
          if (!tel) return alert("Sin WhatsApp");
          const entries = Object.entries(state.cartaCart || {}).filter(([, q]) => q > 0);
          let body;
          if (entries.length) {
            body = "Hola, quiero de la carta del día:\n" + entries.map(([n, q]) => `• ${n} × ${q}`).join("\n") + "\n\n(Adjunto comprobante de pago si aplica)";
          } else {
            body = "Hola, quiero pedir de la carta del día:\n" + (p.carta_diaria_texto || "") + "\n\n(Adjunto comprobante de pago si aplica)";
          }
          const text = encodeURIComponent(body);
          window.open("https://wa.me/" + (tel.startsWith("51") ? tel : "51" + tel) + "?text=" + text, "_blank");
        });

        const refreshCartUI = () => {
          const p = state.profiles[state.index] || {};
          const items = typeof products === "function" ? products(p) : [];
          const monSymbol = (m) => (m === "USD" ? "$" : m === "EUR" ? "€" : "S/");
          const total = Object.entries(state.cart || {}).reduce((n, [id, qty]) => {
            const prod = items.find((x) => {
              const m = parseProductMeta(x);
              return m.name === id || (x.descripcion || "") === id;
            });
            return n + qty * Number(prod?.precio || 0);
          }, 0);
          const n = cartCount();
          const mon = monSymbol(items[0] && (items[0].moneda || "PEN"));
          const tot = app.querySelector("#cart-total-label");
          if (tot) tot.textContent = mon + " " + total.toFixed(2);
          const lines = app.querySelector("#cart-lines");
          if (lines) {
            lines.innerHTML = n
              ? Object.entries(state.cart || {})
                  .map(([id, q]) => "<div>• " + esc(id) + " × " + q + "</div>")
                  .join("")
              : '<span style="opacity:.7">Toca Pedir en un producto</span>';
          }
          const wa = app.querySelector("[data-order]");
          if (wa) wa.textContent = "📱 Pedir por WhatsApp" + (n ? " (" + n + ")" : "");
          app.querySelectorAll("[data-qty-label]").forEach((el) => {
            const id = el.getAttribute("data-qty-label");
            const q = state.cart[id] || 0;
            if (el.tagName === "SPAN" && !el.classList.contains("prod-qty-badge"))
              el.textContent = String(q);
            else el.textContent = q ? "En pedido: " + q : "Toca Pedir para agregar";
          });
          try { mountCartFab(p); } catch (_) {}
        };
        const changeCartQty = (id, delta) => {
          if (!id) return;
          // guardar scroll para no saltar arriba
          const sc = app.querySelector("#cart-scroll");
          const top = sc ? sc.scrollTop : 0;
          state.cart = state.cart || {};
          const cur = state.cart[id] || 0;
          const next = Math.max(0, cur + delta);
          if (next === 0) delete state.cart[id];
          else state.cart[id] = next;
          const p = state.profiles[state.index] || {};
          const prod = (typeof products === "function" ? products(p) : []).find((x) => {
            const m = parseProductMeta(x);
            return m.name === id;
          });
          if (prod) {
            state.cartMeta = state.cartMeta || {};
            state.cartMeta[id] = {
              ...(state.cartMeta[id] || {}),
              precio: Number(prod.precio || 0),
              name: id,
            };
          }
          refreshCartUI();
          if (sc) sc.scrollTop = top;
        };
        app.querySelectorAll("[data-pedir]").forEach((btn) => {
          btn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            changeCartQty(btn.getAttribute("data-pedir"), 1);
          };
        });
        app.querySelectorAll("[data-quitar]").forEach((btn) => {
          btn.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            changeCartQty(btn.getAttribute("data-quitar"), -1);
          };
        });
        app.querySelectorAll("[data-qty]").forEach((btn) => {
          btn.onclick = () => {
            const id = btn.getAttribute("data-id");
            const dir = btn.getAttribute("data-qty");
            changeCartQty(id, dir === "+" ? 1 : -1);
          };
        });
        // restaurar posición vertical tipo TikTok
        {
          const sc = app.querySelector("#cart-scroll");
          if (sc && state.cartSnapTop) {
            sc.scrollTop = state.cartSnapTop;
          }
          sc?.addEventListener(
            "scroll",
            () => {
              state.cartSnapTop = sc.scrollTop;
            },
            { passive: true },
          );
        }

        // rueda del mouse: un producto por vez
        {
          const sc = app.querySelector("#cart-scroll");
          if (sc && !sc._wheelBound) {
            sc._wheelBound = true;
            let lock = false;
            sc.addEventListener(
              "wheel",
              (ev) => {
                if (lock) return;
                const h = sc.clientHeight || 1;
                if (Math.abs(ev.deltaY) < 8) return;
                ev.preventDefault();
                lock = true;
                const dir = ev.deltaY > 0 ? 1 : -1;
                const next = Math.round(sc.scrollTop / h) * h + dir * h;
                sc.scrollTo({ top: Math.max(0, next), behavior: "smooth" });
                state.cartSnapTop = next;
                setTimeout(() => { lock = false; }, 420);
              },
              { passive: false },
            );
          }
        }

        app.querySelectorAll("img[data-zoom-src]").forEach((img) => {
          img.style.cursor = "zoom-in";
          img.style.pointerEvents = "auto";
          img.onclick = (e) => {
            e.preventDefault();
            e.stopPropagation();
            const src = img.getAttribute("data-zoom-src");
            if (!src) return;
            const old = document.querySelector("#pocket .lightbox");
            if (old) old.remove();
            const box = document.createElement("div");
            box.className = "lightbox";
            box.setAttribute("role", "dialog");
            const im = document.createElement("img");
            im.src = src;
            im.alt = "Producto";
            box.appendChild(im);
            box.onclick = () => box.remove();
            (document.getElementById("pocket") || document.body).appendChild(box);
          };
        });
        app.querySelectorAll("[data-open-mockup]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const p = state.profiles[state.index];
            const items = products(p).map((x, i) =>
              typeof x === "string" ? { descripcion: x, precio: 15 } : x,
            );
            const idx = Number(btn.getAttribute("data-open-mockup"));
            const raw = items[idx];
            const meta = parseProductMeta(raw);
            if (!meta.mockup || !meta.mockup.bases || !meta.mockup.bases.length) {
              alert("Este producto no tiene plantillas de mockup");
              return;
            }
            state.mockup = {
              name: meta.name,
              precio: Number(raw.precio || 0),
              moneda: raw.moneda || "PEN",
              bases: meta.mockup.bases,
              baseIndex: 0,
              designUrl: null,
              scale: 1,
              offsetY: 1,
            };
            render();
            setTimeout(() => renderMockupCanvas(), 50);
          });
        });

        app.querySelector("[data-close-mockup]")?.addEventListener("click", () => {
          state.mockup = null;
          render();
        });
        app.querySelectorAll("[data-mock-base]").forEach((b) => {
          b.addEventListener("click", () => {
            if (!state.mockup) return;
            state.mockup.baseIndex = Number(b.getAttribute("data-mock-base")) || 0;
            render();
            setTimeout(() => renderMockupCanvas(), 50);
          });
        });
        app.querySelector("#mockup-design-file")?.addEventListener("change", (ev) => {
          const f = ev.target.files?.[0];
          if (!f || !state.mockup) return;
          state.mockup.designUrl = URL.createObjectURL(f);
          state.mockup.designFile = f;
          renderMockupCanvas();
        });
        app.querySelector("#mockup-scale")?.addEventListener("input", (ev) => {
          if (!state.mockup) return;
          state.mockup.scale = Number(ev.target.value) || 1;
          renderMockupCanvas();
        });
        app.querySelector("#mockup-add-cart")?.addEventListener("click", async () => {
          const m = state.mockup;
          if (!m) return;
          if (!m.designUrl) {
            alert("Sube tu diseño primero");
            return;
          }
          const canvas = document.getElementById("mockup-canvas");
          if (!canvas) return;
          try {
            const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
            let mockupUrl = dataUrl;
            const API = (typeof EDGE !== "undefined" && EDGE) || window.WEBPOCKET_API || "";
            if (API) {
              const up = await fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  action: "upload_mockup",
                  fileData: dataUrl,
                  fileName: "mockup-" + Date.now() + ".jpg",
                }),
              }).then((r) => r.json());
              if (up.url || up.publicUrl) mockupUrl = up.url || up.publicUrl;
            }
            const color = (m.bases[m.baseIndex] || {}).color || "";
            const lineId = m.name + (color ? " · " + color : "") + " · custom";
            state.cart = state.cart || {};
            state.cartMeta = state.cartMeta || {};
            state.cart[lineId] = (state.cart[lineId] || 0) + 1;
            state.cartMeta[lineId] = {
              precio: m.precio,
              moneda: m.moneda,
              color,
              mockupUrl,
              name: m.name,
            };
            state.mockup = null;
            alert("Mockup añadido al carrito");
            render();
          } catch (e) {
            alert(e.message || "No se pudo generar el mockup");
          }
        });

        app.querySelector("[data-order]")?.addEventListener("click", async () => {
          const p = state.profiles[state.index];
          const tel = phoneOf(p);
          const entries = Object.entries(state.cart || {}).filter(([, q]) => q > 0);
          if (!entries.length) return alert("Elige cantidad de al menos un producto");
          if (!tel) return alert("Sin WhatsApp");
          const items = products(p);
          const monSym = (m) => (m === "USD" ? "$" : m === "EUR" ? "€" : "S/");
          const lines = entries.map(([n, q]) => {
            const meta = (state.cartMeta || {})[n];
            const prod = items.find((x) => parseProductMeta(x).name === n || x.descripcion === n);
            const precio = meta?.precio != null ? meta.precio : Number(prod?.precio || 0);
            const mon = monSym(meta?.moneda || prod?.moneda);
            let line = `• ${n} × ${q} (${mon}${Number(precio).toFixed(2)})`;
            if (meta?.mockupUrl && String(meta.mockupUrl).startsWith("http")) {
              line += `\n  Foto mockup: ${meta.mockupUrl}`;
            } else if (prod?.foto && String(prod.foto).startsWith("http")) {
              line += `\n  Foto: ${prod.foto}`;
            }
            return line;
          });
          const text = encodeURIComponent(
            `Hola, quiero este pedido desde WebPocket (%0A${title(p)}):%0A%0A` +
              lines.join("%0A") +
              `%0A%0A(Abre los enlaces de foto para ver el diseño)`,
          );
          // encodeURIComponent already on full text - fix double encoding
          const body =
            "Hola, quiero este pedido desde WebPocket (" +
            title(p) +
            "):\n\n" +
            lines.join("\n") +
            "\n\n(Abre los enlaces de foto para ver el diseño)";
          window.open(
            "https://wa.me/" +
              (tel.startsWith("51") ? tel : "51" + tel) +
              "?text=" +
              encodeURIComponent(body),
            "_blank",
          );
        });

        app.querySelector("#chat-form")?.addEventListener("submit", async (e) => {
          e.preventDefault();
          const input = e.currentTarget.querySelector('[name="msg"]');
          const msg = (input?.value || "").trim();
          if (!msg) return;
          const p = state.profiles[state.index] || {};
          const ck = String(p.codigo_cliente || p.codigo || state.qr || code(p) || "anon");
          if (!state.chatByCode) state.chatByCode = {};
          if (!state.chatByCode[ck]) {
            try {
              const raw = sessionStorage.getItem("wp_chat_" + ck);
              state.chatByCode[ck] = raw ? JSON.parse(raw) : [];
            } catch (_) {
              state.chatByCode[ck] = [];
            }
          }
          const hist = state.chatByCode[ck];
          const box = app.querySelector("#chat-box");
          if (box) {
            box.innerHTML += `<div class="bubble user">${esc(msg)}</div>`;
            box.innerHTML += `<div class="bubble bot typing" id="chat-typing">Escribiendo…</div>`;
            box.scrollTop = box.scrollHeight;
          }
          hist.push({ role: "user", content: msg });
          input.value = "";
          input.disabled = true;
          try {
            const iaPrompt = p.ia_prompt || (() => { try { return JSON.parse(p.estilo_marco||"{}").ia_prompt||""; } catch { return ""; } })();
            const iaKnow = p.ia_conocimiento || (() => { try { return JSON.parse(p.estilo_marco||"{}").ia_conocimiento||""; } catch { return ""; } })();
            const prods = products(p).map((x) => ({
              id: x.id || x.codigo || "",
              nombre: x.nombre || x.name || x.titulo || "",
              precio: x.precio != null ? x.precio : x.price,
              stock: x.stock,
              descripcion: x.descripcion || x.desc || "",
            })).filter((x) => x.nombre);
            const r = await edge({
              action: "chat",
              message: msg,
              codigoCliente: ck,
              codigo_cliente: ck,
              prompt: iaPrompt || p.prompt || "",
              knowledge: iaKnow || p.conocimiento || "",
              history: hist.slice(-12).map((m) => ({ role: m.role, content: m.content })),
              products: prods,
              carrito_activo: prods.length > 0,
            });
            const typing = app.querySelector("#chat-typing");
            if (typing) typing.remove();
            let reply = String(r.reply || r.message || r.answer || "Sin respuesta");
            reply = reply.replace(/\[PRODUCTO:\s*([^\]]+)\]/gi, "$1").trim();
            let suggested = Array.isArray(r.products) ? r.products : [];
            if (!suggested.length && prods.length) {
              const low = reply.toLowerCase();
              suggested = prods.filter((pr) => {
                const n = String(pr.nombre || "").toLowerCase();
                return n.length >= 3 && low.includes(n);
              }).slice(0, 4);
            }
            hist.push({ role: "assistant", content: reply, products: suggested });
            try { sessionStorage.setItem("wp_chat_" + ck, JSON.stringify(hist.slice(-40))); } catch (_) {}
            if (box) {
              let html = `<div class="bubble bot">${esc(reply)}</div>`;
              if (suggested.length || prods.length) {
                html += '<div class="chat-prod-links">';
                suggested.forEach((pr) => {
                  html += '<button type="button" class="chat-prod-btn" data-panel="products" data-product-hint="' +
                    esc(pr.nombre || "") + '">' + esc(pr.nombre || "Producto") +
                    (pr.precio != null ? " · " + esc(String(pr.precio)) : "") + "</button>";
                });
                if (prods.length) {
                  html += '<button type="button" class="chat-prod-btn" data-panel="products" style="background:#0f766e">Ver carrito</button>';
                }
                html += "</div>";
              }
              box.innerHTML += html;
              box.scrollTop = box.scrollHeight;
              box.querySelectorAll(".chat-prod-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                  state.panel = "products";
                  state.productHint = btn.getAttribute("data-product-hint") || "";
                  render();
                });
              });
            }
          } catch (err) {
            const typing = app.querySelector("#chat-typing");
            if (typing) typing.remove();
            if (box) box.innerHTML += `<div class="bubble bot">${esc(err.message || "Error")}</div>`;
          }
          input.disabled = false;
          input.focus();
        });

        
        app.querySelectorAll("[data-panel]").forEach((x) =>
          x.addEventListener("click", () => {
            // gesto del usuario: activar música si aún no suena
            if (state.soundOn !== true) enableSoundNow();
            state.panel = x.dataset.panel === "none" ? null : x.dataset.panel;
            render();
          }),
        );
        app.querySelectorAll("[data-close]").forEach((x) =>
          x.addEventListener("click", () => {
            state.panel = null;
            render();
          }),
        );
        app.querySelector("[data-next]")?.addEventListener("click", () => {
          if (!state.profiles.length) return;
          state.index = (state.index + 1) % state.profiles.length;
          state.panel = null;
          render();
        });
        app.querySelectorAll("[data-profile]").forEach((x) =>
          x.addEventListener("click", () => {
            state.index = Number(x.dataset.profile);
            state.panel = null;
            render();
          }),
        );
        app.querySelectorAll("[data-faq-toggle]").forEach((btn) =>
          btn.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            const item = btn.closest(".faq-item");
            if (!item) return;
            const wasOpen = item.classList.contains("open");
            app.querySelectorAll(".faq-item").forEach((x) => {
              x.classList.remove("open");
              const sp = x.querySelector("[data-faq-toggle] span");
              if (sp) sp.textContent = "+";
            });
            if (!wasOpen) {
              item.classList.add("open");
              const sp = btn.querySelector("span");
              if (sp) sp.textContent = "−";
            }
          }),
        );
        app.querySelectorAll("[data-exp-toggle]").forEach((btn) =>
          btn.addEventListener("click", (ev) => {
            ev.preventDefault();
            ev.stopPropagation();
            const item = btn.closest(".exp-item");
            if (!item) return;
            const wasOpen = item.classList.contains("open");
            app.querySelectorAll(".exp-item").forEach((x) => {
              x.classList.remove("open");
              const sp = x.querySelector("[data-exp-toggle] span");
              if (sp) sp.textContent = "+";
            });
            if (!wasOpen) {
              item.classList.add("open");
              const sp = btn.querySelector("span");
              if (sp) sp.textContent = "−";
            }
          }),
        );
        app.querySelector("[data-share-cv]")?.addEventListener("click", async () => {
          const p = state.profiles[state.index];
          const file = cvFile(p);
          if (!file) { alert('Este perfil aún no tiene un archivo CV subido.'); return; }
          const url = file;
          try {
            if (navigator.share)
              await navigator.share({
                title: title(p),
                text: "CV de " + title(p),
                url,
              });
            else {
              await navigator.clipboard.writeText(url);
              alert(
                file
                  ? "Enlace del archivo CV copiado."
                  : "Enlace del perfil copiado.",
              );
            }
          } catch {
            prompt("Copia el enlace:", url);
          }
        });
        app.querySelector("[data-download-cv]")?.addEventListener("click", () => {
          const p = state.profiles[state.index];
          const file = cvFile(p);
          if (!file) {
            alert("Este perfil aún no tiene un archivo CV subido.");
            return;
          }
          const a = document.createElement("a");
          a.href = file;
          a.target = "_blank";
          a.rel = "noopener";
          a.download = "";
          document.body.appendChild(a);
          a.click();
          a.remove();
        });
      }
      pocket.addEventListener("click", (ev) => {
        if (ev.target.closest("[data-next]")) {
          if (!state.profiles.length) return;
          state.index = (state.index + 1) % state.profiles.length;
          state.panel = null;
          render();
        }
      });
      async function init() {
        showLoader(qrCode ? "CARGANDO PERFIL…" : "CARGANDO EJEMPLOS…");
        try {
          let d = { formatos: [], clientes: [], productos: [], preguntas: [], enlaces: [] };
          try {
            d = await edge({ action: "public_content" });
          } catch (e) {
            console.warn("public_content", e);
          }
          state.formats = d.formatos?.length ? d.formatos : FALLBACK;
          state.service = Boolean(d.ia);
          state.products = d.productos || d.products || [];
          state.valoraciones = d.valoraciones || [];
          state.questions = d.preguntas || [];
          state.links = d.enlaces || [];

          if (qrCode) {
            let one = null;
            try {
              one = await edge({
                action: "public_profile",
                codigo_cliente: qrCode,
                perfil: qrCode,
              });
            } catch (e) {
              console.warn("public_profile", e);
              one = null;
            }
            let profile =
              one?.profile ||
              one?.cliente ||
              one?.client ||
              (d.clientes || []).find(
                (item) => String(item.codigo_cliente) === String(qrCode),
              ) ||
              null;
            if (!profile || !profile.codigo_cliente) {
              throw Error(
                one?.error ||
                  "El perfil QR no está activo o no existe. Código: " + qrCode,
              );
            }
            const active =
              profile.activo === true ||
              profile.activo === "true" ||
              profile.activo === 1 ||
              profile.activo === "1" ||
              profile.activo === undefined;
            if (profile.activo === false || profile.activo === "false" || profile.activo === 0) {
              throw Error(
                "Este perfil aún no está activo. El administrador debe validar el pago.",
              );
            }
            const bag = {
              productos: one?.products || one?.productos || d.productos || [],
              preguntas: one?.questions || one?.preguntas || d.preguntas || [],
              enlaces: one?.links || one?.enlaces || d.enlaces || [],
              valoraciones: one?.valoraciones || [],
              profile: one?.profile || profile,
            };
            state.products = bag.productos;
            state.valoraciones = bag.valoraciones || [];
            state.questions = bag.preguntas;
            state.links = bag.enlaces;
            // fusionar campos de estilo desde profile
            profile.estilo_marco = profile.estilo_marco || one?.profile?.estilo_marco;
            profile.modalidad = profile.modalidad || one?.profile?.modalidad;
            const normalized = normalizePublicProfile(profile, bag);
            state.profiles = [normalized];
            state.index = 0;
          } else {
            state.profiles = DEMOS;
            state.index = 0;
          }
          render();
        } catch (error) {
          console.error(error);
          if (qrCode) {
            app.innerHTML =
              `<div style="padding:20px"><p class="message">${esc(error.message || "No se pudo cargar el perfil")}</p>` +
              `<div class="join" style="margin-top:16px"><a href="${REGISTRO_URL}">Registrar mi WebPocket</a></div></div>`;
          } else {
            state.formats = FALLBACK;
            state.profiles = DEMOS;
            state.service = false;
            try {
              render();
            } catch (e) {
              app.innerHTML = `<p class="message" style="padding:20px">Error al mostrar ejemplos.</p>`;
            }
          }
        } finally {
          hideLoader();
        }
      }
      // zoom global (no depende de re-render)
      if (!window.__wpZoom) {
        window.__wpZoom = true;
        document.getElementById("pocket")?.addEventListener(
          "click",
          (e) => {
            const img = e.target.closest?.("img[data-zoom-src]");
            if (!img) return;
            e.preventDefault();
            e.stopPropagation();
            const src = img.getAttribute("data-zoom-src");
            if (!src) return;
            document.querySelector("#pocket .lightbox")?.remove();
            const box = document.createElement("div");
            box.className = "lightbox";
            const im = document.createElement("img");
            im.src = src;
            box.appendChild(im);
            box.onclick = () => box.remove();
            document.getElementById("pocket").appendChild(box);
          },
          true,
        );
      }
      init();
    </script>
  </body>
</html>
