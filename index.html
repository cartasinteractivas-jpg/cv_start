<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030713" />
    <title>WebPocket · CV Start</title>
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #f8fafc;
        background: #030611;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: radial-gradient(
          circle at 50% 0,
          #17396a 0,
          #061124 33%,
          #02040b 85%
        );
      }
      button,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 18px;
      }
      .pocket {
        --main: #38bdf8;
        --second: #a78bfa;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        width: min(100%, 430px);
        height: min(92vh, 840px);
        height: min(92dvh, 840px);
        min-height: 650px;
        border: 1px solid color-mix(in srgb, var(--main) 60%, #e2e8f0);
        border-radius: 31px;
        background: #030713;
        box-shadow:
          0 24px 90px color-mix(in srgb, var(--main) 26%, transparent),
          inset 0 0 0 1px #ffffff18;
      }
      @media (max-width: 520px) {
        .stage {
          padding: 0;
          place-items: stretch;
          min-height: 100vh;
          min-height: 100dvh;
        }
        .pocket {
          width: 100%;
          max-width: none;
          height: 100vh;
          height: 100dvh;
          min-height: 100vh;
          min-height: 100dvh;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          box-shadow: none;
        }
        .loader-overlay {
          border-radius: 0;
        }
        .app {
          padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px));
        }
      }
      .background {
        position: absolute;
        inset: 0;
        z-index: -3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(1.05) saturate(1.15) contrast(1.05);
        background: #050914;
      }
      .shade {
        position: absolute;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          #03071188 0%,
          #07101e18 22%,
          #06102410 48%,
          #02030bcc 100%
        );
      }
      .app {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 17px 14px 15px;
        gap: 12px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      .brand h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.7px;
      }
      .brand small,
      .eyebrow {
        display: block;
        margin-top: 4px;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1.2px;
        color: #dbeafe;
      }
      .status {
        display: inline-block;
        margin-top: 9px;
        border: 1px solid #4ade8080;
        border-radius: 999px;
        padding: 4px 7px;
        background: #052e16a8;
        color: #bbf7d0;
        font-size: 8px;
        font-weight: 900;
      }
      .status.warn {
        border-color: #fde0477d;
        background: #3f2c0399;
        color: #fef08a;
      }
      .counter {
        border: 1px solid #fff4;
        border-radius: 999px;
        padding: 8px 10px;
        background: #06111eb8;
        font-size: 10px;
        font-weight: 900;
      }
      .menu {
        display: flex;
        gap: 6px;
        padding: 8px;
        max-width: 100%;
        overflow: auto;
        border: 1px solid #fff3;
        border-radius: 16px;
        background: #06101bd9;
        backdrop-filter: blur(16px);
        scrollbar-width: none;
      }
      .menu::-webkit-scrollbar {
        display: none;
      }
      .menu.side {
        position: absolute;
        left: 14px;
        top: 132px;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.side-right {
        position: absolute;
        right: 14px;
        top: 132px;
        left: auto;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.floating-right {
        position: absolute;
        right: 14px;
        top: 142px;
        left: auto;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.floating-left {
        position: absolute;
        left: 14px;
        top: 142px;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.bottom {
        order: 0;
        margin-top: 0;
        align-self: stretch;
      }
      .menu button {
        border: 0;
        border-radius: 9px;
        padding: 8px 9px;
        background: transparent;
        color: #f8fafc;
        font-size: 9px;
        font-weight: 900;
        white-space: nowrap;
      }
      .menu button:hover,
      .menu button.active {
        background: linear-gradient(135deg, var(--main), var(--second));
        color: #04111b;
      }
      .content {
        margin-top: auto;
        padding: 8px 2px;
        color: #f8fafc;
        text-shadow: 0 2px 15px #020617;
      }
      .content.shifted {
        margin-left: 111px;
      }
      .content.shifted-right {
        margin-right: 111px;
      }
      .content h2 {
        margin: 7px 0;
        font-size: clamp(37px, 10vw, 56px);
        line-height: 0.88;
        letter-spacing: -2.8px;
        max-width: 9ch;
      }
      .role {
        margin: 0 0 11px;
        font-size: 13px;
        font-weight: 800;
      }
      .desc {
        max-width: 32ch;
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        font-weight: 600;
      }
      .location {
        margin: 11px 0 0;
        font-size: 11px;
        font-weight: 750;
      }
      
      .head.minimal {
        justify-content: flex-end;
        min-height: 28px;
      }
      .content.centered-info {
        text-align: center;
        align-items: center;
        top: 12%;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: min(92%, 340px);
        bottom: auto;
      }
      .content.centered-info h2 {
        font-size: 26px;
      }
      .content.centered-info .desc {
        text-align: center;
      }
      .actions.center-actions {
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 340px);
        justify-content: center;
      }

      .format-caption {
        margin: 12px 0 0;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1px;
        opacity: 0.82;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .actions.single {
        grid-template-columns: 1fr;
      }
      .action {
        min-height: 47px;
        border: 1px solid #fff4;
        border-radius: 15px;
        background: #06111eb8;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        text-decoration: none;
        display: grid;
        place-items: center;
      }
      .action.primary {
        border-color: transparent;
        color: #06111c;
        background: linear-gradient(135deg, var(--main), var(--second));
        box-shadow: 0 10px 26px color-mix(in srgb, var(--main) 40%, transparent);
      }
      .profile-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .profile-tools button {
        min-height: 42px;
        border: 1px solid #fff4;
        border-radius: 12px;
        background: #06111eb8;
        color: #fff;
        font-size: 11px;
        font-weight: 850;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .dots {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .dot {
        border: 0;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ffffff66;
        padding: 0;
      }
      .dot.active {
        width: 20px;
        background: var(--main);
      }
      .foot-note {
        font-size: 8px;
        letter-spacing: 0.8px;
        font-weight: 850;
        opacity: 0.72;
      }
      .join {
        display: flex;
        justify-content: center;
        margin-top: 2px;
      }
      .join a {
        min-height: 48px;
        padding: 12px 28px;
        border-radius: 999px;
        text-decoration: none;
        background: linear-gradient(135deg, #fff45a, #facc15);
        color: #16130a;
        font-size: 13px;
        font-weight: 950;
        box-shadow:
          0 0 0 1px #fff8,
          inset 0 1px #fff9,
          0 0 26px #facc1580;
      }
      .overlay {
        display: none;
        position: absolute;
        z-index: 10;
        inset: 0;
        padding: 12px;
        background: linear-gradient(180deg, #01030af0, #02030df4);
        backdrop-filter: blur(11px);
      }
      .overlay.open {
        display: flex;
        align-items: flex-end;
      }
      .sheet {
        max-height: 92%;
        width: 100%;
        overflow: auto;
        border: 1px solid color-mix(in srgb, var(--main) 75%, #d9f99d);
        border-radius: 23px;
        padding: 18px;
        background: linear-gradient(
          155deg,
          #060a15fa 0%,
          #040812fc 58%,
          #02040bf9 100%
        );
        color: #f8fafc;
        box-shadow: 0 24px 70px #000d;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 14px;
      }
      .sheet h3 {
        margin: 0;
        font-size: 21px;
      }
      .sheet p {
        font-size: 12px;
        line-height: 1.45;
        color: #dbeafe;
      }
      .close {
        width: 34px;
        height: 34px;
        border: 1px solid #fff4;
        border-radius: 50%;
        background: #0a1222;
        color: #fff;
        font-size: 19px;
      }
      .card-list,
      .gallery {
        display: grid;
        gap: 10px;
      }
      .card {
        padding: 12px;
        border: 1px solid #ffffff24;
        border-radius: 14px;
        background: #0a1020e8;
      }
      .card b {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }
      .card p {
        margin: 0;
      }
      .product {
        gap: 9px;
        align-items: center;
      }
      .product img {
        object-fit: cover;
        border-radius: 12px;
        background: #0f172a;
      }
      .card-list .card.product {
        display: grid;
        grid-template-columns: 62px 1fr;
      }
      .card-list .card.product img {
        width: 62px;
        height: 62px;
      }
      .cart-carrusel {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 4px 2px 12px;
        -webkit-overflow-scrolling: touch;
      }
      .cart-carrusel .card.product {
        min-width: 82%;
        scroll-snap-align: center;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0;
        overflow: hidden;
      }
      .cart-carrusel .card.product img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 14px 14px 0 0;
      }
      .cart-carrusel .card.product > div {
        padding: 0 12px 12px;
      }
      .cart-grilla {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .cart-grilla .card.product {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        text-align: center;
      }
      .cart-grilla .card.product img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 12px;
      }
      .cart-lista {
        display: grid;
        gap: 8px;
      }
      .cart-lista .card.product {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        align-items: center;
        padding: 10px;
      }
      .cart-lista .card.product img {
        width: 56px;
        height: 56px;
        border-radius: 10px;
      }
      .cart-vitrina .card.product {
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--main) 55%, #fff3);
      }
      .cart-vitrina .card.product img {
        width: 100%;
        height: 190px;
      }
      .cart-vitrina .card.product > div {
        padding: 0 14px 14px;
        text-align: center;
      }
      .cart-market {
        display: grid;
        gap: 10px;
      }
      .cart-market .card.product {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 10px;
        border: 1px solid color-mix(in srgb, var(--main) 45%, #fff2);
        background: linear-gradient(
          135deg,
          #0a1020ee,
          color-mix(in srgb, var(--main) 12%, #0a1020)
        );
      }
      .cart-market .card.product img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
      }
      .cart-hint {
        font-size: 10px;
        opacity: 0.75;
        margin: 0 0 8px;
      }
      .gallery iframe {
        width: 100%;
        aspect-ratio: 16/9;
        border: 0;
        border-radius: 13px;
        background: #000;
      }
      .faq-item,
      .exp-item {
        border: 1px solid #ffffff24;
        border-radius: 14px;
        background: #0a1020e8;
        overflow: hidden;
      }
      .faq-item button,
      .exp-item button {
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: #f8fafc;
        padding: 12px;
        font-size: 13px;
        font-weight: 800;
        display: flex;
        justify-content: space-between;
        gap: 8px;
      }
      .faq-body,
      .exp-body {
        display: none;
        padding: 0 12px 12px;
        font-size: 12px;
        line-height: 1.45;
        color: #dbeafe;
      }
      .faq-item.open .faq-body,
      .exp-item.open .exp-body {
        display: block;
      }
      .message {
        padding: 11px;
        border: 1px solid #facc1580;
        border-radius: 13px;
        background: #312805bf;
        color: #fef3c7;
        font-size: 12px;
      }
      .loader-overlay {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: linear-gradient(160deg, #020611f5, #061124f0 40%, #030713fa);
        border-radius: 31px;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }
      .loader-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-ring {
        width: 54px;
        height: 54px;
        border: 3px solid #ffffff22;
        border-top-color: var(--main, #38bdf8);
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      .loader-text {
        font-size: 13px;
        font-weight: 800;
      }
      .loader-sub {
        font-size: 10px;
        opacity: 0.7;
        letter-spacing: 1px;
        font-weight: 700;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-height: 730px) {
        .content h2 {
          font-size: 39px;
        }
        .desc {
          font-size: 12px;
        }
        .format-caption {
          display: none;
        }
      }
    </style>
  </head>
  <body>

          <div class="loader-ring"></div>

          <div class="loader-sub">CARGANDO…</div>
        </div>
        <div class="app" id="app">Preparando perfil…</div>
      </section>
    </main>

            if (parts.length >= 3)
              return {
                cargo: parts[0],
                empresa: parts[1],
                periodo: parts[2],
                detalle: parts[3] || "",
              };
            return { cargo: line, empresa: "", periodo: "", detalle: "" };
          });
      };
      /* Unifica campos del cliente público (cualquier nombre de columna) */
      const normalizePublicProfile = (raw, bag = {}) => {
        if (!raw) return null;
        const p = { ...raw };
        p.nombre = p.nombre || p.name || "";
        p.negocio = p.negocio || p.empresa || p.business || "";
        p.categoria = p.categoria || p.giro || p.cargo || p.ocupacion || "";
        p.perfil =
          p.perfil ||
          p.descripcion ||
          p.about ||
          p.bio ||
          p.descripcion_perfil ||
          "";
        p.descripcion = p.perfil;
        p.tipo_perfil = (
          p.tipo_perfil ||
          p.tipo ||
          (p.negocio ? "NEGOCIO" : "CV")
        ).toUpperCase();
        p.direccion = p.direccion || p.ubicacion || p.address || "";
        p.telefono = p.telefono || p.celular || p.whatsapp || p.phone || "";
        p.dni = p.dni || p.documento || p.nro_documento || p.document || "";
        p.color_principal =
          p.color_principal || p.colorPrincipal || p.color1 || "";
        p.color_secundario =
          p.color_secundario || p.colorSecundario || p.color2 || "";
        p.formato_id = p.formato_id || p.formatoId || p.format_id || "";
        p.urlvideo =
          p.urlvideo_aprobado ||
          p.urlvideo ||
          p.video_url ||
          p.video ||
          "";
        p.urlvideo_aprobado = p.urlvideo_aprobado || p.urlvideo;
        p.urlfoto =
          p.urlfoto_aprobado ||
          p.urlfoto ||
          p.foto_url ||
          p.foto ||
          p.foto_perfil ||
          "";
        p.url_cv =
          p.url_cv ||
          p.url_curriculum ||
          p.archivo_cv ||
          p.cv_url ||
          p.url_archivo ||
          "";
        p.products =
          p.products ||
          p.productos ||
          (bag.productos || []).filter(
            (x) => String(x.codigo_cliente) === String(p.codigo_cliente),
          );
        p.preguntas = normalizeQuestions(
          p.preguntas ||
            p.questions ||
            (bag.preguntas || []).filter(
              (x) => String(x.codigo_cliente) === String(p.codigo_cliente),
            ),
        );
        p.gallery =
          p.gallery ||
          (typeof p.videos === "string"
            ? p.videos.split("\n").map((l) => l.trim()).filter(Boolean)
            : null) ||
          (bag.enlaces || [])
            .filter((x) => String(x.codigo_cliente) === String(p.codigo_cliente))
            .map((x) => x.url || x.valor_enlace)
            .filter(Boolean);
        p.experiencia = expFor(p);
        p.chat =
          p.chat ||
          p.modo_ia === "IA" ||
          p.modo_preguntas === "IA" ||
          String(p.tipo_chat || "").toUpperCase() === "IA";
        p.estilo_tarjetas =
          p.estilo_tarjetas ||
          (state.formats.find((f) => String(f.id) === String(p.formato_id)) ||
            {}).estilo_tarjetas ||
          "";
        return p;
      };
      
      const videoEmbedHtml = (url) => {
        url = normalizeVideoUrl(url);
        const raw = String(url || "").trim();
        if (!raw) return "";
        try {
          const u = new URL(raw.startsWith("http") ? raw : "https://" + raw);
          const host = u.hostname.replace(/^www\./, "").toLowerCase();
          if (host.includes("youtube.com") || host === "youtu.be") {
            const id =
              u.searchParams.get("v") ||
              u.pathname.split("/").filter(Boolean).pop();
            if (!id)
              return `<p class="message">Esta página no se puede acceder al video.</p>`;
            return `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}" allowfullscreen loading="lazy" title="Video"></iframe>`;
          }
          if (host.includes("vimeo.com")) {
            const id = u.pathname.split("/").filter(Boolean).pop();
            if (!id)
              return `<p class="message">Esta página no se puede acceder al video.</p>`;
            return `<iframe src="https://player.vimeo.com/video/${encodeURIComponent(id)}" allowfullscreen loading="lazy" title="Video"></iframe>`;
          }
          if (/\.(mp4|webm|ogg)(\?|$)/i.test(u.pathname)) {
            return `<video controls playsinline src="${esc(raw)}" style="width:100%;border-radius:13px;background:#000"></video>`;
          }
          return `<iframe src="${esc(raw)}" loading="lazy" title="Video"></iframe><p class="message">Si no se ve el video, esta página no permite incrustarlo o el formato no es compatible.</p>`;
        } catch {
          return `<p class="message">Esta página no se puede acceder al video.</p>`;
        }
      };
      const cartClass = (p) => {
        const s = (
          p.estilo_tarjetas ||
          format(p).estilo_tarjetas ||
          ""
        ).toLowerCase();
        if (s.includes("carrusel")) return "cart-carrusel";
        if (s.includes("grilla")) return "cart-grilla";
        if (s.includes("lista")) return "cart-lista";
        if (s.includes("vitrina")) return "cart-vitrina";
        if (s.includes("market")) return "cart-market";
        return "card-list";
      };
      const cartHint = (cls) =>
        ({
          "cart-carrusel": "Desliza → carrusel de productos",
          "cart-grilla": "Vista grilla · 2 columnas",
          "cart-lista": "Lista compacta",
          "cart-vitrina": "Vitrina grande",
          "cart-market": "Estilo market / pedido rápido",
        })[cls] || "Productos";
      function panel(p) {
        if (!state.panel) return "";
        const close =
          '<button type="button" class="close" data-close>×</button>';
        if (state.panel === "questions") {
          const qs = questions(p);
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">PREGUNTAS</span><h3>Pregúntame</h3></div>${close}</div><div class="card-list">${
            qs
              .map(
                (q, i) =>
                  `<article class="faq-item"><button type="button" data-faq-toggle="${i}"><b>${esc(q.pregunta || q[0])}</b><span>+</span></button><div class="faq-body">${esc(q.respuesta || q[1] || "")}</div></article>`,
              )
              .join("") || "<p>No hay preguntas públicas.</p>"
          }</div></section></aside>`;
        }
        if (state.panel === "experience") {
          const ex = expFor(p);
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">TRAYECTORIA</span><h3>Experiencia</h3></div>${close}</div><div class="card-list">${
            ex
              .map(
                (e, i) =>
                  `<article class="exp-item"><button type="button" data-exp-toggle="${i}"><b>${esc(e.cargo || "Experiencia")}${e.empresa ? " · " + esc(e.empresa) : ""}</b><span>+</span></button><div class="exp-body"><p>${e.periodo ? `<b>${esc(e.periodo)}</b><br>` : ""}${esc(e.detalle || "")}</p></div></article>`,
              )
              .join("") || "<p>Sin experiencia cargada.</p>"
          }</div></section></aside>`;
        }
        if (state.panel === "maps") {
          const dir = p.direccion || "";
          let embedUrl = dir
            ? `https://maps.google.com/maps?q=${encodeURIComponent(dir)}&z=15&output=embed`
            : "";
          try {
            if (p.maps) {
              const u = new URL(p.maps);
              const qq =
                u.searchParams.get("q") || dir || u.pathname.replace(/^\//, "");
              embedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(qq)}&z=15&output=embed`;
            }
          } catch {
            /* keep embedUrl */
          }
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">UBICACIÓN</span><h3>${esc(title(p))}</h3></div>${close}</div>${dir ? `<p style="margin:0 0 10px">⌖ ${esc(dir)}</p>` : ""}<div class="gallery"><iframe src="${esc(embedUrl)}" title="Mapa" loading="lazy" style="width:100%;aspect-ratio:1/1;border:0;border-radius:14px;background:#0a1020"></iframe></div><p class="message">Mapa dentro de WebPocket.</p></section></aside>`;
        }
        if (state.panel === "info") {
          const tel = phoneOf(p);
          const dni = dniOf(p);
          const dir = p.direccion || "";
          const wa = tel ? `https://wa.me/51${tel.replace(/^51/, "")}` : "";
          const call = tel ? `tel:+${tel.startsWith("51") ? tel : "51" + tel}` : "";
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">CONTACTO</span><h3>Información</h3></div>${close}</div><div class="card-list">${dni ? `<article class="card"><b>DNI / Documento</b><p>${esc(dni)}</p></article>` : ""}${tel ? `<article class="card"><b>Teléfono</b><p>${esc(p.telefono || p.celular || tel)}</p><div class="profile-tools" style="margin-top:10px"><a class="action primary" style="text-decoration:none" href="${esc(wa)}" target="_blank" rel="noreferrer">WhatsApp</a><a class="action" style="text-decoration:none" href="${esc(call)}">Llamar</a></div></article>` : ""}${dir ? `<article class="card"><b>Dirección</b><p>${esc(dir)}</p></article>` : ""}${!dni && !tel && !dir ? "<p>Sin datos de contacto públicos.</p>" : ""}</div></section></aside>`;
        }
        if (state.panel === "products") {
          const items = products(p).map((x, i) =>
            typeof x === "string"
              ? {
                  descripcion: x,
                  precio: [12, 18, 28, 35, 9][i] || 15,
                  foto: "webpocket-pizza.jpg",
                }
              : x,
          );
          const cls = cartClass(p);
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">PRODUCTOS</span><h3>${esc(title(p))}</h3></div>${close}</div><p class="cart-hint">${esc(cartHint(cls))}</p><div class="${cls}">${items
            .map(
              (x) =>
                `<article class="card product"><img src="${esc(x.foto || "")}" alt="${esc(x.descripcion)}"><div><b>${esc(x.descripcion)}</b><p>S/ ${Number(x.precio || 0).toFixed(2)}${x.stock != null ? ` · Stock ${esc(x.stock)}` : ""}</p></div></article>`,
            )
            .join("")}</div><p class="message">Para pedir, contacta a este negocio.</p></section></aside>`;
        }
        if (state.panel === "gallery")
          return `<aside class="overlay open"><section class="sheet"><div class="sheet-head"><div><span class="eyebrow">GALERÍA</span><h3>Videos</h3></div>${close}</div><div class="gallery">${
            links(p).map(normalizeVideoUrl).map(videoEmbedHtml).join("") || "<p>No hay videos públicos.</p>"
          }</div></section></aside>`;
        return "";
      }
      function render() {
        const p = state.profiles[state.index];
        if (!p) {
          app.innerHTML =
            '<p class="message">No se encontró el perfil solicitado.</p>';
          return;
        }
        const f = format(p),
          main = p.color_principal || f.color_principal || "#38bdf8",
          second = p.color_secundario || f.color_secundario || "#a78bfa",
          menu = menuClass(p),
          q = questions(p).length,
          pro = products(p).length,
          gal = links(p).length,
          exp = expFor(p).length,
          cv = isCV(p),
          src = publicVideo(p);
        pocket.style.setProperty("--main", main);
        pocket.style.setProperty("--second", second);
        const primaryPanel = pro
          ? "products"
          : exp
            ? "experience"
            : q
              ? "questions"
              : "none";
        const primaryLabel = pro
          ? "Ver productos"
          : exp
            ? "Ver experiencia"
            : q
              ? "Pregúntame"
              : "Ver perfil";
        app.innerHTML = `${mediaBackground(p)}<div class="shade"></div><header class="head minimal"><span class="counter">${state.qr ? "" : `${String(state.index + 1).padStart(2, "0")}/${String(state.profiles.length).padStart(2, "0")}`}</span></header><nav class="menu ${menu}"><button type="button" class="active" data-close>PERFIL</button>${q ? '<button type="button" data-panel="questions">PREGÚNTAME</button>' : ""}${exp ? '<button type="button" data-panel="experience">EXPERIENCIA</button>' : ""}${(state.qr || dniOf(p) || phoneOf(p) || p.direccion) ? '<button type="button" data-panel="info">INFORMACIÓN</button>' : ""}${pro ? '<button type="button" data-panel="products">PRODUCTOS</button>' : ""}${gal ? '<button type="button" data-panel="gallery">VIDEOS</button>' : ""}</nav><section class="content centered-info"><span class="eyebrow">${esc(p.categoria || p.giro || p.tipo_perfil || "")}</span><h2>${esc(title(p))}</h2><p class="role">${esc(p.categoria || p.tipo_perfil || "")}</p><p class="desc">${esc(p.perfil || p.descripcion || "")}</p>${!cv && p.direccion ? `<p class="location">⌖ ${esc(p.direccion)}</p>` : ""}</section><div class="actions center-actions ${state.qr ? "single" : ""}"><button type="button" class="action primary" data-panel="${primaryPanel}">${primaryLabel}</button>${state.qr ? "" : '<button type="button" class="action" data-next>Otro perfil</button>'}</div>${
          cv
            ? `<div class="profile-tools"><button type="button" data-share-cv>Compartir CV</button><button type="button" data-download-cv>Bajar CV</button></div>`
            : pro
              ? `<div class="profile-tools"><button type="button" data-panel="products">Ver carrito</button></div>`
              : ""
        }<div class="footer">${
          state.qr
            ? ""
            : `<div class="dots">${state.profiles
                .map(
                  (_, i) =>
                    `<button type="button" class="dot ${i === state.index ? "active" : ""}" data-profile="${i}"></button>`,
                )
                .join("")}</div>`
        }<span class="foot-note"></span></div>${
          state.qr
            ? ""
            : `<div class="join"><a href="${REGISTRO_URL}">Registrar</a></div>`
        }${panel(p)}`;
        bind();
      }
      function bind() {
        app.querySelectorAll("[data-panel]").forEach((x) =>
          x.addEventListener("click", () => {
            state.panel = x.dataset.panel === "none" ? null : x.dataset.panel;
            render();
          }),
        );
        app.querySelectorAll("[data-close]").forEach((x) =>
          x.addEventListener("click", () => {
            state.panel = null;
            render();
          }),
        );
        app.querySelector("[data-next]")?.addEventListener("click", () => {
          if (!state.profiles.length) return;
          state.index = (state.index + 1) % state.profiles.length;
          state.panel = null;
          render();
        });
        app.querySelectorAll("[data-profile]").forEach((x) =>
          x.addEventListener("click", () => {
            state.index = Number(x.dataset.profile);
            state.panel = null;
            render();
          }),
        );
        app.querySelectorAll("[data-faq-toggle]").forEach((btn) =>
          btn.addEventListener("click", () => {
            const item = btn.closest(".faq-item");
            const open = item.classList.contains("open");
            app.querySelectorAll(".faq-item").forEach((x) => x.classList.remove("open"));
            app.querySelectorAll("[data-faq-toggle] span").forEach((s) => (s.textContent = "+"));
            if (!open) {
              item.classList.add("open");
              btn.querySelector("span").textContent = "−";
            }
          }),
        );
        app.querySelectorAll("[data-exp-toggle]").forEach((btn) =>
          btn.addEventListener("click", () => {
            const item = btn.closest(".exp-item");
            const open = item.classList.contains("open");
            app.querySelectorAll(".exp-item").forEach((x) => x.classList.remove("open"));
            app.querySelectorAll("[data-exp-toggle] span").forEach((s) => (s.textContent = "+"));
            if (!open) {
              item.classList.add("open");
              btn.querySelector("span").textContent = "−";
            }
          }),
        );
        app.querySelector("[data-share-cv]")?.addEventListener("click", async () => {
          const p = state.profiles[state.index];
          const file = cvFile(p);
          if (!file) { alert('Este perfil aún no tiene un archivo CV subido.'); return; }
          const url = file;
          try {
            if (navigator.share)
              await navigator.share({
                title: title(p),
                text: "CV de " + title(p),
                url,
              });
            else {
              await navigator.clipboard.writeText(url);
              alert(
                file
                  ? "Enlace del archivo CV copiado."
                  : "Enlace del perfil copiado.",
              );
            }
          } catch {
            prompt("Copia el enlace:", url);
          }
        });
        app.querySelector("[data-download-cv]")?.addEventListener("click", () => {
          const p = state.profiles[state.index];
          const file = cvFile(p);
          if (!file) {
            alert("Este perfil aún no tiene un archivo CV subido.");
            return;
          }
          const a = document.createElement("a");
          a.href = file;
          a.target = "_blank";
          a.rel = "noopener";
          a.download = "";
          document.body.appendChild(a);
          a.click();
          a.remove();
        });
      }
      pocket.addEventListener("click", (ev) => {
        if (ev.target.closest("[data-next]")) {
          if (!state.profiles.length) return;
          state.index = (state.index + 1) % state.profiles.length;
          state.panel = null;
          render();
        }
      });
      async function init() {
        showLoader(qrCode ? "CARGANDO PERFIL…" : "CARGANDO EJEMPLOS…");
        try {
          const d = await edge({ action: "public_content" });
          state.formats = d.formatos?.length ? d.formatos : FALLBACK;
          state.service = Boolean(d.ok);
          state.products = d.productos || [];
          state.questions = d.preguntas || [];
          state.links = d.enlaces || [];
          if (qrCode) {
            /* Perfil público completo: public_profile trae preguntas/enlaces + datos */
            let one = null;
            try {
              one = await edge({
                action: "public_profile",
                codigo_cliente: qrCode,
                perfil: qrCode,
              });
            } catch (_) {
              one = null;
            }
            let profile =
              one?.profile ||
              one?.cliente ||
              one?.client ||
              (d.clientes || []).find(
                (item) => String(item.codigo_cliente) === String(qrCode),
              ) ||
              null;
            if (!profile || !profile.codigo_cliente)
              throw Error("El perfil QR no está activo o no existe.");
            const active =
              profile.activo === true ||
              profile.activo === "true" ||
              profile.activo === 1 ||
              profile.activo === "1";
            if (!active)
              throw Error(
                "Este perfil aún no está activo. El administrador debe validar el pago.",
              );
            /* Fusionar bolsa de datos de ambas respuestas */
            const bag = {
              productos: one?.products || one?.productos || d.productos || [],
              preguntas: one?.questions || one?.preguntas || d.preguntas || [],
              enlaces: one?.links || one?.enlaces || d.enlaces || [],
            };
            state.products = bag.productos;
            state.questions = bag.preguntas;
            state.links = bag.enlaces;
            const normalized = normalizePublicProfile(profile, bag);
            state.profiles = [normalized];
            state.index = 0;
          } else {
            state.profiles = DEMOS;
            state.index = 0;
          }
          render();
        } catch (error) {
          if (qrCode) {
            app.innerHTML = `<p class="message">${esc(error.message)}</p><div class="join" style="margin-top:16px"><a href="${REGISTRO_URL}">Registrar mi WebPocket</a></div>`;
          } else {
            state.formats = FALLBACK;
            state.profiles = DEMOS;
            state.service = false;
            render();
          }
        } finally {
          setTimeout(hideLoader, 350);
        }
      }
      init();
    </script>
  </body>
</html>
