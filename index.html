<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030713" />
    <title>WebPocket · CV Start</title>
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #f8fafc;
        background: #030611;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: radial-gradient(
          circle at 50% 0,
          #17396a 0,
          #061124 33%,
          #02040b 85%
        );
      }
      button,
      a {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .stage {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 18px;
      }
      .pocket {
        --main: #38bdf8;
        --second: #a78bfa;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        width: min(100%, 430px);
        height: min(92vh, 840px);
        height: min(92dvh, 840px);
        min-height: 650px;
        border: 1px solid color-mix(in srgb, var(--main) 60%, #e2e8f0);
        border-radius: 31px;
        background: #030713;
        box-shadow:
          0 24px 90px color-mix(in srgb, var(--main) 26%, transparent),
          inset 0 0 0 1px #ffffff18;
      }
      @media (max-width: 520px) {
        .stage {
          padding: 0;
          place-items: stretch;
          min-height: 100vh;
          min-height: 100dvh;
        }
        .pocket {
          width: 100%;
          max-width: none;
          height: 100vh;
          height: 100dvh;
          min-height: 100vh;
          min-height: 100dvh;
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          box-shadow: none;
        }
        .loader-overlay {
          border-radius: 0;
        }
        .app {
          padding: 14px 12px calc(14px + env(safe-area-inset-bottom, 0px));
        }
      }
      .background {
        position: absolute;
        inset: 0;
        z-index: -3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(1.05) saturate(1.15) contrast(1.05);
        background: #050914;
      }
      .shade {
        position: absolute;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          #03071188 0%,
          #07101e18 22%,
          #06102410 48%,
          #02030bcc 100%
        );
      }
      .app {
        position: relative;
        z-index: 1;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        padding: 17px 14px 15px;
        gap: 12px;
      }
      .head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }
      
      .overlay.open { z-index: 100 !important; }

      /* Capas: video/fondo → avatar (chat) → UI chat/botones */
      .background {
        z-index: 0 !important;
        background: #050914 !important;
      }
      #wp-bg-video,
      .background video {
        width: 100% !important;
        height: 100% !important;
        object-fit: contain !important;
        object-position: center !important;
        background: #050914;
      }

      #wp-avatar-wrap {
        z-index: 1 !important;
      }
      .shade {
        z-index: 2;
        pointer-events: none;
      }
      .app {
        position: relative;
        z-index: 3;
      }
      .head,
      .menu,
      .actions,
      .footer,
      .join,
      .inline-chat,
      .volver-fab,
      .sound-fab,
      #cart-fab-global {
        position: relative;
        z-index: 10;
      }
      .social-float {
        z-index: 30;
      }

      /* Chat IA: siempre abajo a ancho completo, NO afectado por menú lateral */
      .inline-chat,
      .inline-chat.inline-chat-full {
        position: absolute !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding: 8px 12px calc(12px + env(safe-area-inset-bottom, 0px)) !important;
        z-index: 55 !important;
        box-sizing: border-box !important;
        pointer-events: auto !important;
        background: linear-gradient(180deg, transparent 0%, #020617cc 28%, #020617ee 100%);
      }
      .inline-chat-log {
        max-height: min(28vh, 200px) !important;
      }
      .menu.side,
      .menu.side-right,
      .menu.floating-left,
      .menu.floating-right {
        z-index: 20 !important; /* menú bajo el chat */
      }


      .social-float {
        z-index: 30;
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 35;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .social-float a {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1220cc;
        border: 1px solid #ffffff44;
        box-shadow: 0 6px 16px #0008;
        backdrop-filter: blur(6px);
      }
      .social-float a img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .sound-fab {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 300;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid #ffffff55;
        background: #0b1220cc;
        color: #fff;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 16px #0008;
      }
      .head.compact {
        min-height: 0;
        margin-bottom: 0;
      }
      .head.compact .brand { display: none; }
      .brand h1 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.7px;
      }
      .brand small,
      .eyebrow {
        display: block;
        margin-top: 4px;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1.2px;
        color: #dbeafe;
      }
      .status {
        display: inline-block;
        margin-top: 9px;
        border: 1px solid #4ade8080;
        border-radius: 999px;
        padding: 4px 7px;
        background: #052e16a8;
        color: #bbf7d0;
        font-size: 8px;
        font-weight: 900;
      }
      .status.warn {
        border-color: #fde0477d;
        background: #3f2c0399;
        color: #fef08a;
      }
      .counter {
        border: 1px solid #fff4;
        border-radius: 999px;
        padding: 8px 10px;
        background: #06111eb8;
        font-size: 10px;
        font-weight: 900;
      }
      .menu {
        display: flex;
        gap: 6px;
        padding: 8px;
        max-width: 100%;
        overflow: auto;
        border: 1px solid #fff3;
        border-radius: 16px;
        background: #06101bd9;
        backdrop-filter: blur(16px);
        scrollbar-width: none;
      }
      .menu::-webkit-scrollbar {
        display: none;
      }
      .menu.side {
        position: absolute;
        left: 14px;
        top: 132px;
        flex-direction: column;
        width: 104px;
        z-index: 3;
      }
      .menu.side-right {
        position: absolute !important;
        right: 14px !important;
        top: 132px !important;
        left: auto !important;
        flex-direction: column !important;
        width: 104px !important;
        z-index: 3 !important;
      }
      .menu.floating-right {
        position: absolute;
        right: 14px;
        top: 142px;
        left: auto;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.floating-left {
        position: absolute;
        left: 14px;
        top: 142px;
        max-width: 118px;
        flex-direction: column;
        z-index: 3;
      }
      .menu.bottom {
        order: 0;
        margin-top: 0;
        align-self: stretch;
      }
      .menu button {
        font-size: var(--menu-size, 12px);
        border: 0;
        border-radius: 9px;
        padding: 8px 9px;
        background: transparent;
        color: #f8fafc;
        font-size: 9px;
        font-weight: 900;
        white-space: nowrap;
      }
      .menu button:hover,
      .menu button.active {
        background: var(--btn-sel, var(--main));
        color: var(--menu-sel, #ffffff) !important;
      }
      .content {
        margin-top: auto;
        padding: 8px 2px;
        color: #f8fafc;
        text-shadow: 0 2px 15px #020617;
      }
      .content.shifted {
        margin-left: 111px;
      }
      .content.shifted-right {
        margin-right: 111px;
      }

      .content h2 { color: var(--text, #f8fafc); }
      .role { color: var(--text2, var(--second, #e2e8f0)); }
      .desc { color: var(--text, #f8fafc); }
      .menu { background: var(--menu-bg, #06101bd9); }
      .menu button { color: var(--menu-no, #f8fafc); }
      .menu button.active, .menu button:hover {
        background: var(--btn-sel, var(--main));
        color: var(--menu-sel, #ffffff) !important;
      }
      
      .overlay.chat-overlay {
        align-items: center !important;
        justify-content: center;
        padding: 10% 12px 12px !important;
        background: transparent !important;
        backdrop-filter: none !important;
      }
      .overlay.chat-overlay::before {
        content: "";
        position: absolute;
        inset: 0;
        background: #02061755;
        backdrop-filter: blur(2.5px);
        pointer-events: none;
        border-radius: 31px;
      }
      .sheet-chat {
        display: flex;
        flex-direction: column;
        max-height: 62%;
        width: 100%;
        margin: auto;
        position: relative;
        z-index: 2;
        background: #0a122066 !important;
        border: 1px solid #ffffff33 !important;
        backdrop-filter: blur(6px);
        box-shadow: 0 16px 40px #0008;
      }
      .sheet-chat.transparent {
        background: #0a122040 !important;
        backdrop-filter: blur(5px);
      }
      .sheet-chat .sheet-head {
        background: transparent;
      }
      .chat-box {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 6px 2px 10px;
        min-height: 160px;
        max-height: 42vh;
      }
      .bubble {
        max-width: 90%;
        padding: 10px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.45;
        font-weight: 650;
        text-shadow: 0 1px 3px #000a;
      }
      .bubble.bot {
        align-self: flex-start;
        background: transparent;
        border: 0;
        color: #f8fafc;
        border-bottom-left-radius: 4px;
      }
      .bubble.user {
        align-self: flex-end;
        background: transparent;
        border: 0;
        color: #fff;
        border-bottom-right-radius: 4px;
        text-align: right;
      }
      .bubble.typing { opacity: 0.75; font-style: italic; }
      .chat-form {
        display: flex;
        gap: 8px;
        align-items: center;
        border-top: 1px solid #ffffff22;
        padding-top: 10px;
        background: transparent;
      }
      .chat-form input {
        flex: 1;
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid #ffffff44;
        background: #0b1220aa;
        color: #fff;
        padding: 0 12px;
        font-size: 14px;
      }
      .chat-send {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 12px;
        font-weight: 800;
        background: var(--btn-sel, var(--main));
        color: var(--menu-sel, #fff);
      }

      .action {
        color: var(--btn-letra, #ffffff) !important;
      }
      .action.primary {
        background: var(--btn-sel, var(--main)) !important;
        color: var(--btn-letra, #ffffff) !important;
      }
      .action:not(.primary) {
        color: var(--btn-letra2, var(--btn-letra, #e2e8f0)) !important;
      }
      .action.primary * { color: inherit !important; }
      /* Degradé solo si el cliente activó combinar colores */
      #pocket[data-btn-blend="1"] .action.primary,
      #pocket[data-btn-blend="1"] .actions .action.primary,
      #pocket[data-btn-blend="1"] button.action.primary {
        background: linear-gradient(135deg, var(--btn-sel, var(--main)), var(--second)) !important;
      }
      /* menú: solo aquí se usan --menu-sel / --menu-no */
      .menu button {
        color: var(--menu-no, #e2e8f0) !important;
      }
      .menu button.active {
        color: var(--menu-sel, #ffffff) !important;
      }

      .content h2 {
        margin: 7px 0;
        font-size: clamp(37px, 10vw, 56px);
        line-height: 0.88;
        letter-spacing: -2.8px;
        max-width: 9ch;
      }
      .role {
        margin: 0 0 11px;
        font-size: 13px;
        font-weight: 800;
      }
      .desc {
        max-width: 32ch;
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        font-weight: 600;
      }
      .location {
        margin: 11px 0 0;
        font-size: 11px;
        font-weight: 750;
      }
      
      .format-caption {
        margin: 12px 0 0;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 1px;
        opacity: 0.82;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .actions.single {
        grid-template-columns: 1fr;
      }
      .action {
        min-height: 47px;
        border: 1px solid #fff4;
        border-radius: 15px;
        background: #06111eb8;
        color: #fff;
        font-size: 12px;
        font-weight: 900;
        text-decoration: none;
        display: grid;
        place-items: center;
      }
      .action.primary {
        border-color: transparent;
        color: #06111c;
        background: var(--btn-sel, var(--main));
        box-shadow: 0 10px 26px color-mix(in srgb, var(--btn-sel, var(--main)) 40%, transparent);
      }
      .profile-tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .profile-tools button {
        min-height: 42px;
        border: 1px solid #fff4;
        border-radius: 12px;
        background: #06111eb8;
        color: #fff;
        font-size: 11px;
        font-weight: 850;
      }
      .footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      .dots {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .dot {
        border: 0;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #ffffff66;
        padding: 0;
      }
      .dot.active {
        width: 20px;
        background: var(--main);
      }
      .foot-note {
        font-size: 8px;
        letter-spacing: 0.8px;
        font-weight: 850;
        opacity: 0.72;
      }
      .join {
        display: flex;
        justify-content: center;
        margin-top: 2px;
      }
      .join a {
        min-height: 48px;
        padding: 12px 28px;
        border-radius: 999px;
        text-decoration: none;
        background: linear-gradient(135deg, #fff45a, #facc15);
        color: #16130a;
        font-size: 13px;
        font-weight: 950;
        box-shadow:
          0 0 0 1px #fff8,
          inset 0 1px #fff9,
          0 0 26px #facc1580;
      }
      .overlay {
        display: none;
        position: absolute;
        z-index: 100;
        inset: 0;
        padding: 12px;
        background: linear-gradient(180deg, #01030af0, #02030df4);
        backdrop-filter: blur(11px);
      }
      .overlay.open {
        display: flex;
        align-items: flex-start;
        padding-top: 8px;
        overflow-y: auto;
      }
      .sheet {
        max-height: 92%;
        width: 100%;
        overflow: auto;
        margin-top: 0;
        align-self: flex-start;
        border: 1px solid color-mix(in srgb, var(--main) 75%, #d9f99d);
        border-radius: 23px;
        padding: 18px;
        background: linear-gradient(
          155deg,
          #060a15fa 0%,
          #040812fc 58%,
          #02040bf9 100%
        );
        color: #f8fafc;
        box-shadow: 0 24px 70px #000d;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: flex-start;
        margin-bottom: 14px;
      }
      .sheet h3 {
        margin: 0;
        font-size: 21px;
      }
      .sheet p {
        font-size: 12px;
        line-height: 1.45;
        color: #dbeafe;
      }
      .close {
        width: 34px;
        height: 34px;
        border: 1px solid #fff4;
        border-radius: 50%;
        background: #0a1222;
        color: #fff;
        font-size: 19px;
      }
      .card-list,
      .gallery {
        display: grid;
        gap: 10px;
      }
      .card {
        padding: 12px;
        border: 1px solid #ffffff24;
        border-radius: 14px;
        background: #0a1020e8;
      }
      .card b {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
      }
      .card p {
        margin: 0;
      }
      .product {
        gap: 9px;
        align-items: center;
      }
      .product img {
        object-fit: cover;
        border-radius: 12px;
        background: #0f172a;
      }
      .card-list .card.product {
        display: grid;
        grid-template-columns: 62px 1fr;
      }
      .card-list .card.product img {
        width: 62px;
        height: 62px;
      }
      .cart-carrusel {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding: 4px 2px 12px;
        -webkit-overflow-scrolling: touch;
      }
      .cart-carrusel .card.product {
        min-width: 82%;
        scroll-snap-align: center;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0;
        overflow: hidden;
      }
      .cart-carrusel .card.product img {
        width: 100%;
        height: 160px;
        object-fit: cover;
        border-radius: 14px 14px 0 0;
      }
      .cart-carrusel .card.product > div {
        padding: 0 12px 12px;
      }
      .cart-grilla {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .cart-grilla .card.product {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        text-align: center;
      }
      .cart-grilla .card.product img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 12px;
      }
      .cart-lista {
        display: grid;
        gap: 8px;
      }
      .cart-lista .card.product {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        align-items: center;
        padding: 10px;
      }
      .cart-lista .card.product img {
        width: 56px;
        height: 56px;
        border-radius: 10px;
      }
      .cart-vitrina .card.product {
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--main) 55%, #fff3);
      }
      .cart-vitrina .card.product img {
        width: 100%;
        height: 190px;
      }
      .cart-vitrina .card.product > div {
        padding: 0 14px 14px;
        text-align: center;
      }
      .cart-market {
        display: grid;
        gap: 10px;
      }
      .cart-market .card.product {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 10px;
        border: 1px solid color-mix(in srgb, var(--main) 45%, #fff2);
        background: linear-gradient(
          135deg,
          #0a1020ee,
          color-mix(in srgb, var(--main) 12%, #0a1020)
        );
      }
      .cart-market .card.product img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
      }
      .qty {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .qty button {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        border: 1px solid #ffffff33;
        background: linear-gradient(180deg, #1e293bcc, #0f172acc);
        color: #fff;
        font-size: 18px;
        font-weight: 900;
        cursor: pointer;
      }
      .qty span {
        min-width: 24px;
        text-align: center;
        font-weight: 800;
      }
      .carta-sheet {
        min-height: 100%;
        height: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .carta-sheet.full {
        height: 100% !important;
        max-height: 100% !important;
        min-height: 100% !important;
        background: transparent !important;
        background-color: transparent !important;
        position: absolute;
        inset: 0;
        border-radius: 0;
        max-width: 100%;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      .carta-sheet .carta-inner {
        flex: 1;
        overflow-y: auto;
        padding: 72px 14px 110px;
        -webkit-overflow-scrolling: touch;
      }
      .carta-sheet .carta-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        z-index: 0;
      }
      .carta-sheet .carta-bg::after {
        display: none !important;
        content: none !important;
        background: none !important;
      }
      .carta-sheet .sheet-head {
        position: relative;
        z-index: 2;
        background: transparent !important;
        margin-top: 8px;
      }
      .carta-sheet .carta-inner,
      .carta-sheet .order-box {
        position: relative;
        z-index: 1;
      }
      .carta-sheet .order-box {
        background: transparent !important;
        background-color: transparent !important;
        border-top: 1px solid #0002 !important;
